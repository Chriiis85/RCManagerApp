name: Keep Supabase Alive

on:
  schedule:
    # Se ejecuta cada 3 días a las 00:00 UTC (alrededor de las 02:00 hora España)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions de GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API and Database
        run: |
          curl -I https://rc-manager-api.vercel.app/api/parks
