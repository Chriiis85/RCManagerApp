<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCManager Dashboard | Tailwind Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-950 text-slate-50 font-sans min-h-screen p-4 md:p-12 bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-slate-800 to-slate-950 selection:bg-indigo-500/30">
    
    <div class="max-w-6xl mx-auto">
        <header class="text-center mb-12">
            <h1 class="text-4xl md:text-6xl font-black bg-gradient-to-r from-indigo-400 to-pink-400 bg-clip-text text-transparent pb-2 uppercase tracking-tight">
                RCManager Dashboard
            </h1>
            <p class="text-slate-400 text-lg font-medium">Visual interface for your Theme Park API</p>
        </header>

        <nav class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4 md:gap-6 mb-12">
            <button onclick="fetchData('parks')" class="group p-6 bg-slate-800/40 border border-white/10 backdrop-blur-xl rounded-2xl text-center transition-all duration-300 hover:-translate-y-2 hover:border-indigo-500 hover:bg-slate-700/60 hover:shadow-2xl hover:shadow-indigo-500/10 active:scale-95">
                <span class="text-4xl mb-3 block transition-transform group-hover:scale-125 group-hover:rotate-12">🏰</span>
                <span class="font-bold text-lg">Parks</span>
            </button>
            <button onclick="fetchData('coasters')" class="group p-6 bg-slate-800/40 border border-white/10 backdrop-blur-xl rounded-2xl text-center transition-all duration-300 hover:-translate-y-2 hover:border-indigo-500 hover:bg-slate-700/60 hover:shadow-2xl hover:shadow-indigo-500/10 active:scale-95">
                <span class="text-4xl mb-3 block transition-transform group-hover:scale-125 group-hover:rotate-12">🎢</span>
                <span class="font-bold text-lg">Coasters</span>
            </button>
            <button onclick="fetchData('attractions')" class="group p-6 bg-slate-800/40 border border-white/10 backdrop-blur-xl rounded-2xl text-center transition-all duration-300 hover:-translate-y-2 hover:border-indigo-500 hover:bg-slate-700/60 hover:shadow-2xl hover:shadow-indigo-500/10 active:scale-95">
                <span class="text-4xl mb-3 block transition-transform group-hover:scale-125 group-hover:rotate-12">🎡</span>
                <span class="font-bold text-lg">Attractions</span>
            </button>
            <button onclick="fetchData('shows')" class="group p-6 bg-slate-800/40 border border-white/10 backdrop-blur-xl rounded-2xl text-center transition-all duration-300 hover:-translate-y-2 hover:border-indigo-500 hover:bg-slate-700/60 hover:shadow-2xl hover:shadow-indigo-500/10 active:scale-95">
                <span class="text-4xl mb-3 block transition-transform group-hover:scale-125 group-hover:rotate-12">🎭</span>
                <span class="font-bold text-lg">Shows</span>
            </button>
            <button onclick="fetchData('restaurants')" class="group p-6 bg-slate-800/40 border border-white/10 backdrop-blur-xl rounded-2xl text-center transition-all duration-300 hover:-translate-y-2 hover:border-indigo-500 hover:bg-slate-700/60 hover:shadow-2xl hover:shadow-indigo-500/10 active:scale-95">
                <span class="text-4xl mb-3 block transition-transform group-hover:scale-125 group-hover:rotate-12">🍕</span>
                <span class="font-bold text-lg">Restaurants</span>
            </button>
        </nav>

        <section class="animate-fade-in">
            <h2 id="result-title" class="text-2xl font-bold text-slate-200 mb-6 flex items-center gap-2">
                <span class="w-2 h-8 bg-indigo-500 rounded-full"></span>
                Select a category to explore
            </h2>
            
            <div id="results" class="bg-slate-900/40 border border-white/10 backdrop-blur-md rounded-3xl p-6 min-h-[450px] overflow-hidden shadow-inner relative">
                <div class="flex flex-col items-center justify-center min-h-[400px] text-slate-500 space-y-4">
                    <div class="text-6xl animate-bounce">🚀</div>
                    <p class="text-xl font-medium">Your data journey starts here...</p>
                    <p class="text-sm">Click any button above to fetch data from your API</p>
                </div>
            </div>
        </section>
    </div>

    <script>
        async function fetchData(endpoint) {
            const resultsDiv = document.getElementById('results');
            const title = document.getElementById('result-title');
            
            title.innerText = "Fetching " + endpoint + "...";
            resultsDiv.innerHTML = '<div class="flex flex-col items-center justify-center min-h-[400px] text-indigo-400 space-y-4"><div class="w-12 h-12 border-4 border-indigo-500/20 border-t-indigo-500 rounded-full animate-spin"></div><p class="animate-pulse font-medium">Contacting API...</p></div>';

            try {
                const response = await fetch("/api/" + endpoint);
                if (!response.ok) throw new Error("Error: " + response.status);
                const data = await response.json();

                title.innerHTML = '<span class="w-2 h-8 bg-indigo-500 rounded-full"></span> ' + endpoint.charAt(0).toUpperCase() + endpoint.slice(1);

                if (data.length === 0) {
                    resultsDiv.innerHTML = '<div class="flex flex-col items-center justify-center min-h-[400px] text-slate-500 space-y-4"><span class="text-6xl">🔍</span><p class="text-lg">No records found for ' + endpoint + '.</p></div>';
                    return;
                }

                const excluded = ['id', 'createdAt', 'updatedAt', 'parkId', 'operatorId', 'slug'];
                const headers = Object.keys(data[0]).filter(k => !excluded.includes(k) && typeof data[0][k] !== 'object');
                const hasPark = typeof data[0].park === 'object';

                let html = '<div class="overflow-x-auto"><table class="w-full text-left border-collapse">';
                html += '<thead class="bg-slate-950/40 sticky top-0 backdrop-blur-xl uppercase text-xs font-bold text-slate-400 tracking-widest border-b border-white/5"><tr>';
                headers.forEach(h => html += '<th class="px-5 py-4">' + h.replace(/([A-Z])/g, ' $1') + '</th>');
                if (hasPark) html += '<th class="px-5 py-4">Park</th>';
                html += '</tr></thead><tbody class="divide-y divide-white/5">';

                data.forEach(item => {
                    html += '<tr class="hover:bg-indigo-500/5 transition-colors group/row">';
                    headers.forEach(h => {
                        let val = item[h] ?? '-';
                        if (typeof val === 'boolean') val = val ? '<span class="text-emerald-400">Yes</span>' : '<span class="text-rose-400">No</span>';
                        if (h === 'status') {
                            html += '<td class="px-5 py-4"><span class="px-3 py-1 bg-indigo-500/20 text-indigo-300 rounded-full text-xs font-bold font-mono">' + val + '</span></td>';
                        } else {
                            html += '<td class="px-5 py-4 text-slate-300 font-medium">' + val + '</td>';
                        }
                    });
                    if (hasPark) {
                        html += '<td class="px-5 py-4"><span class="text-pink-400 font-semibold">' + (item.park?.name || '-') + '</span></td>';
                    }
                    html += '</tr>';
                });
                html += '</tbody></table></div>';
                resultsDiv.innerHTML = html;

            } catch (error) {
                resultsDiv.innerHTML = '<div class="flex flex-col items-center justify-center min-h-[400px] text-rose-400 space-y-4 p-8 text-center"><span class="text-6xl">❌</span><p class="text-xl font-bold">' + error.message + '</p></div>';
            }
        }
    </script>
</body>
</html>
